# hyprlock — lock screen. Bound to SUPER+L in conf/keybinds.lua.
#
# This file is not Lua: hyprlock uses Hyprland's classic config syntax
# (brace blocks and `key = value`).
#
# To test without locking yourself out, run `hyprlock --immediate-render` and
# unlock normally. If the password stops working, switch to another TTY with
# Ctrl+Alt+F2 and run `pkill hyprlock`.

# ── Palette ───────────────────────────────────────────────────────────────
# hyprlock has no `include`, so the block between the markers below is
# rewritten by ~/.config/theme/apply.py on every theme switch. Don't edit
# between the markers — edit ~/.config/theme/palettes.py instead.
# >>> CORES
$base     = rgba(1e1e2eff)
$crust    = rgba(11111bff)
$surface0 = rgba(313244ff)
$text     = rgba(cdd6f4ff)
$subtext0 = rgba(a6adc8ff)
$lavender = rgba(b4befeff)
$mauve    = rgba(cba6f7ff)
$red      = rgba(f38ba8ff)
$green    = rgba(a6e3a1ff)
# <<< CORES

general {
    # Hide the cursor once it stops moving.
    hide_cursor = true

    # Ignore empty submissions, so brushing Enter doesn't count as an attempt.
    ignore_empty_input = true

    # If hyprlock hangs, Hyprland notices and lets you recover the session
    # instead of leaving you stuck on a dead screen.
    fail_timeout = 2000
}

# ── Background ────────────────────────────────────────────────────────────
background {
    monitor =

    # `screenshot` blurs whatever is on screen. Remove this line to fall back
    # to a solid color instead.
    path = screenshot

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ── Clock ─────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 96
    font_family = SpaceMono Nerd Font
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $crust
}

# ── Date ──────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %d'
    color = $subtext0
    font_size = 20
    font_family = SpaceMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# ── Password field ────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true

    outer_color = $lavender
    inner_color = $base
    font_color = $text
    check_color = $mauve      # shown while the password is being checked
    fail_color = $red         # shown on a wrong password

    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">  Password</span>
    fail_text = <span foreground="##f38ba8">  $FAIL  (attempt $ATTEMPTS)</span>

    # Warns when Caps Lock is on.
    capslock_color = $red

    rounding = 16
    position = 0, 0
    halign = center
    valign = center
}

# ── Username ──────────────────────────────────────────────────────────────
label {
    monitor =
    text =    $USER
    color = $subtext0
    font_size = 16
    font_family = SpaceMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

# ── Battery (laptops only) ────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] echo "  $(cat /sys/class/power_supply/BAT0/capacity)%  ·  $(cat /sys/class/power_supply/BAT0/status)"
    color = $subtext0
    font_size = 14
    font_family = SpaceMono Nerd Font
    position = -30, 20
    halign = right
    valign = bottom
}
