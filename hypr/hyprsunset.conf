# hyprsunset — blue-light filter (Hyprland's "night light").
#
# This file is NOT Lua: hyprsunset uses Hyprland's classic config syntax, with
# brace blocks and `key = value`.
#
# The daemon is started in conf/autostart.lua, and only if the package is
# installed:
#
#   sudo pacman -S hyprsunset
#
# ── How it works ───────────────────────────────────────────────────────────
#
# You declare PROFILES with times. hyprsunset applies the profile whose time has
# already passed and keeps it until the next one. It is not a continuous fade
# across the day: it is a switch at each listed time.
#
# `temperature` is the color temperature in Kelvin. LOWER is warmer (more
# yellow):
#
#   6500  neutral, the screen's native color — same as no filter
#   5000  slightly warm, almost imperceptible
#   4000  clearly yellow, comfortable at night
#   3000  strongly orange, for just before bed
#   2500  extreme, distorts colors too much to work in
#
# `identity = true` means "do not touch anything" — that is how you turn the
# filter off in a profile, and it is cheaper than asking for 6500K explicitly.
#
# `gamma` scales overall brightness (1.0 = unchanged). Below 1.0 it darkens
# beyond what the monitor's own brightness does, which helps in a dark room.
#
# ── Manual control ─────────────────────────────────────────────────────────
#
# With the daemon running, you can force a state without editing this file:
#
#   hyprctl hyprsunset temperature 4000   # apply now
#   hyprctl hyprsunset gamma 90           # 90% brightness
#   hyprctl hyprsunset identity           # filter off
#   hyprctl hyprsunset profile            # go back to following the schedule
#
# After editing this file, restart the daemon for it to take effect:
#   pkill hyprsunset && hyprsunset &

# Gamma ceiling, as a percentage. 100 is native brightness; leaving headroom at
# 150 allows BRIGHTENING the screen past normal via `hyprctl hyprsunset gamma`,
# which is useful in a very bright room.
max-gamma = 150

# ── Morning: no filter ─────────────────────────────────────────────────────
# Native colors during the day. Important for anything where color matters —
# editing images, picking a palette, reviewing design.
profile {
    time = 06:30
    identity = true
}

# ── Late afternoon: light filter ───────────────────────────────────────────
# Starts before it actually gets dark, so the transition is not a jolt.
profile {
    time = 18:00
    temperature = 5000
    gamma = 100
}

# ── Evening: full filter ───────────────────────────────────────────────────
profile {
    time = 20:00
    temperature = 4000
    gamma = 100
}

# ── Late night: warm and dimmer ────────────────────────────────────────────
# If you code late and find this too yellow, raise it to 3500 or delete the
# block — the 20:00 profile then holds until morning.
profile {
    time = 23:00
    temperature = 3400
    gamma = 90
}
