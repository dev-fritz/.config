# kitty configuration.
#
#   kitty.conf   this file: everything that is behavior
#   theme.conf   colors only, generated by ~/.config/theme/apply.py
#
# To apply changes: ctrl+shift+f5 reloads the config in the current window and
# ctrl+shift+f6 shows the resolved config, which helps when debugging.
#
# To discover options: `kitty --debug-config` prints everything in effect, or
# see `man kitty.conf` and https://sw.kovidgoyal.net/kitty/conf/


# ── Font ───────────────────────────────────────────────────────────────────

# The trailing "Mono" matters: it is the variant with fixed-width icons, which
# keeps columns aligned in Neovim, lazygit and btop. The variant without "Mono"
# draws icons double-width and misaligns everything.
font_family      SpaceMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

# Fine-tunes the cell height. SpaceMono is naturally tight; 5% of extra room
# reads better in long sessions.
modify_font cell_height 105%

# Ligatures (`->` and `=>` becoming a single glyph). SpaceMono has none, so this
# changes nothing today; it is here in case the font changes to JetBrainsMono or
# Fira Code.
#   never    off
#   cursor   off only in the cell under the cursor, which helps while editing
#   always   always on
disable_ligatures cursor


# ── Cursor ─────────────────────────────────────────────────────────────────

# Cursor trail: it slides to the new position instead of teleporting.
# 1 is fast and short, 3 is slow and long, 0 is off.
cursor_trail 1

# Only draw the trail for jumps larger than N cells, so it doesn't fire on
# every keystroke.
cursor_trail_start_threshold 2

cursor_shape block
cursor_blink_interval 0


# ── Window ─────────────────────────────────────────────────────────────────

window_padding_width 10

# No system title bar: under Hyprland the compositor draws the frame, and its
# border already shows which window has focus.
hide_window_decorations yes

# Don't ask when closing. Replace the 0 with a number to confirm when more than
# that many tabs are open.
confirm_os_window_close 0

# Transparency. Hyprland's blur (conf/look.lua, 2 passes) only shows through
# something translucent — with an opaque terminal it was being computed for the
# bar and the menus alone. 0.92 makes the effect visible without hurting text
# readability.
#
# If it gets in the way over a light wallpaper, go back to 1.0: the GPU cost of
# the blur does not change, it stays on for Waybar and rofi either way.
background_opacity 0.92

# Allows changing the opacity at runtime, without editing this file. The
# shortcuts are in the keybindings section below.
dynamic_background_opacity yes


# ── Tabs ───────────────────────────────────────────────────────────────────

tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted

# Tab title plus the window count, when there is more than one.
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Only show the bar once there is more than one tab.
tab_bar_min_tabs 2


# ── Scrolling and history ──────────────────────────────────────────────────

scrollback_lines 10000
wheel_scroll_multiplier 3.0


# ── Behavior ───────────────────────────────────────────────────────────────

enable_audio_bell no
visual_bell_duration 0.0

# Selecting with the mouse copies to the clipboard right away.
copy_on_select clipboard

# Clickable links.
url_style curly
open_url_with default
detect_urls yes


# ── Keybindings ────────────────────────────────────────────────────────────
# kitty's defaults are good; only the additions are here.
# List them all with: kitty --debug-config | grep -i '^map'

# New tab or window opens in the current directory, not in $HOME.
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

# Font size on the fly.
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Background opacity on the fly — useful for reading something behind the
# terminal, or for making it opaque during a screen share. Requires
# `dynamic_background_opacity yes`, enabled above.
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default

# Jump straight to a tab.
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5


# ── Performance ────────────────────────────────────────────────────────────
# Uncomment to reduce typing latency, at the cost of more CPU and battery. On a
# laptop the defaults are usually the better trade.
# input_delay 0
# repaint_delay 2
# sync_to_monitor no


# ── Theme ──────────────────────────────────────────────────────────────────
# Last on purpose: in kitty later settings override earlier ones, so the theme
# has the final word on colors. theme.conf is generated by
# ~/.config/theme/apply.py — switch variants with SUPER+SHIFT+T.
include theme.conf
